name: CI

# The five check steps run exactly the commands a maintainer runs locally, with
# no divergent flags: pnpm typecheck, pnpm lint, pnpm format:check, pnpm test,
# pnpm build.
#
# One deliberate difference, stated here rather than glossed over: the install
# step uses `--frozen-lockfile`, where the documented maintainer command is plain
# `pnpm install`. That is intentional hardening. CI must fail if the lockfile is
# stale rather than silently re-resolving, otherwise a green run could be testing
# dependencies nobody committed. It does not change what any check asserts.
#
# See openspec/specs/build-and-verification/spec.md.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A new push to the same branch supersedes the previous run. Redundant runs on a
# PR cost minutes and tell nobody anything new.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out
        uses: actions/checkout@v7

      # Pinned to the versions verified locally on 2026-10-02 (Node v26.10.0,
      # pnpm 12.6.0). Left unpinned, this workflow would silently drift to a new
      # major and could pass or fail for reasons unrelated to the change.
      #
      # Action major versions were looked up, not guessed: checkout v7,
      # setup-node v7, action-setup v6 are the current majors as of 2026-10-02.
      # Node v26.10.0 was confirmed present in the nodejs.org dist index and is
      # the newest 26.x release. It is not an LTS line; it is pinned because it is
      # the version this repository is actually verified against, and matching the
      # verified local runtime is the point.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12.6.0

      - name: Install Node
        uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build website
        run: pnpm build

  spike-self-test:
    name: spike self-test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # The M0 spike is deliberately NOT a workspace member, so `pnpm install` at
    # the root does not install it and `pnpm test` does not run it. Its
    # self-test is a separate job, run in its own directory, because it is the
    # harness's own contract check and it issues zero network requests.
    #
    # This is the M0 gate re-verified. It is not the M0 provider probe: that one
    # needs live credentials and a real sender, and is documented in
    # docs/PROVIDERS.md rather than run in CI.
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: pnpm
          cache-dependency-path: tests/provider-spike/pnpm-lock.yaml

      - name: Install spike dependencies
        run: pnpm --dir tests/provider-spike install --frozen-lockfile

      - name: Spike self-test
        run: pnpm --dir tests/provider-spike spike:selftest

  browser:
    name: browser
    runs-on: ubuntu-latest
    # Its own timeout, and the reason is not politeness. A browser download plus a
    # Chromium cold start on a clean runner is minutes, and this job must not be
    # able to fail the `verify` job's budget by sharing it. 15 is `verify`'s value
    # and is not inherited: the two jobs are siblings, not stages.
    #
    # **A backstop only, because a job-level ceiling cannot diagnose a hang.** Two runs
    # were killed by the job timeout having produced `The operation was canceled.` and
    # nothing else. Raising it from 20 to 30 changed nothing except how long the job sat
    # producing nothing — the second run was silent for 29m34s, which *confirms* the
    # hang is indefinite rather than slow, and therefore is not a budget problem at all.
    # The ceilings that do the diagnostic work are per-step and below.
    timeout-minutes: 25

    # The browser tier (pnpm test:browser), run by its maintainer command with no
    # divergent flags. It is NOT part of `pnpm verify` and is not added to it here.
    #
    # That separation is a requirement, not a scheduling preference:
    # openspec/specs/build-and-verification/spec.md requires `pnpm verify` to run
    # with no browser installed, which was verified by pointing
    # PLAYWRIGHT_BROWSERS_PATH at an empty directory. Folding this tier into
    # `verify` would make that requirement false in CI while leaving it true on a
    # maintainer's machine - the exact shape of a claim that survives only where it
    # is not exercised.
    #
    # What this job establishes: the built page, in real Chromium, against real
    # IndexedDB, with provider traffic intercepted from recorded responses. It
    # establishes NOTHING about a live provider, about `use it externally`, or
    # about how a real provider responds to being polled every five seconds. All
    # three remain unverified, and the suite asserts the fourth rather than
    # claiming it.
    #
    # **Since M8 this job also carries the extension's tier, and the list above is now
    # incomplete rather than merely dated.** The extension tier additionally establishes
    # that the built `dist` loads as an unpacked extension in a real Chromium, that its
    # manifest is accepted and its declared host permissions are **granted**, that
    # `chrome.storage` round-trips read back through the platform's own API, and that the
    # service worker survived a 30-second idle window.
    #
    # **It still establishes nothing about a live provider** — every provider response in
    # both tiers is a recorded one — and it establishes **nothing about how either
    # surface looks**. No test in either tier reads a rendered pixel's colour or position.
    # The one live network call in this repository, `apps/extension/e2e/live-host-permission.mjs`,
    # is deliberately **not run here** and not run by `verify`; a boundary assertion
    # enforces that, so the quarantine cannot rot quietly.

    # **`CI=true` is set for the whole job, and it is load-bearing.** Playwright reads
    # it: `forbidOnly` and retries go to their CI defaults and the reporter becomes
    # non-interactive. GitHub sets `CI=true` for every step anyway, but a claim about how
    # this suite behaves on a runner should not rest on a variable a step-level override
    # could quietly remove. Stated explicitly so it is a decision rather than an ambient
    # fact.
    env:
      CI: "true"

    steps:
      - name: Check out
        uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 12.6.0

      - uses: actions/setup-node@v7
        with:
          node-version: 26.10.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `--with-deps` installs the shared libraries Chromium needs on a clean
      # Ubuntu runner. Without it this job fails for a reason that has nothing to
      # do with the code, which is the kind of failure that trains a team to
      # ignore a red build.
      #
      # Run with `--dir apps/web` because @playwright/test is that package's dev
      # dependency, and pnpm does not put a workspace member's binaries on the
      # root's PATH.
      #
      # **That sentence is now half true, and the correction is the point.** Since M8,
      # `@playwright/test` is *two* packages' dev dependency: `apps/web`'s and
      # `apps/extension`'s, both at the same pinned version. So "the website's dependency"
      # was a claim about one client that had quietly become a claim about both, and a
      # reader would have had to notice the second manifest to know the browser tier's
      # runner had changed shape.
      #
      # The browser download is deliberately not cached between runs. A cache keyed
      # on a path that can move is a cache that can silently serve the wrong
      # bytes; the honest cost is re-downloading, and the job's own timeout
      # absorbs it. **Measured at 24 seconds on a cold runner**, so this step is not
      # where the first run's time went. The ceiling is per-step for the reason given on
      # the last step: a hang must name the step it happened in.
      - name: Install Chromium
        timeout-minutes: 5
        run: pnpm --dir apps/web exec playwright install --with-deps chromium

      # **The extension's own install, as its own step, even though it is very
      # probably a no-op.**
      #
      # The two packages pin the same Playwright version and Playwright's default
      # `PLAYWRIGHT_BROWSERS_PATH` is a per-user cache, so one install serves both and
      # this step downloads nothing. **That is an inference about a shared cache, and
      # this repository does not record inferences as measurements.** If the two ever
      # diverged on version, or if a runner image set `PLAYWRIGHT_BROWSERS_PATH`, the
      # extension tier would fail to find a browser and the failure would name no cause
      # — it would read as the suite being broken.
      #
      # So the second install is explicit, and the cost is a few seconds of a no-op.
      - name: Install Chromium (extension)
        timeout-minutes: 5
        run: pnpm --dir apps/extension exec playwright install chromium

      # **A maintainer runs `pnpm test:browser`; this runs the same command.** No
      # extra flags, because the suite's assertions do not vary by environment and a
      # divergent flag here would be a second thing to keep in step.
      #
      # **Since M8 that one command runs two suites, and this step's ceiling has to
      # cover both.** It builds both clients and then runs the website's tier (34 cases,
      # ~12s) followed by the extension's (16 cases, ~35s — a large part of which is a
      # deliberate 30-second idle-lifetime measurement). The job's own 25-minute ceiling
      # is the backstop; this 10-minute step ceiling is the one that can diagnose, and
      # **it was raised from nothing rather than recalculated** because both halves are
      # still far inside it and a tighter number would only ever be a guess about the
      # runner this has never been measured on.
      #
      # **The ceiling is per-STEP, and that is what turns a hang into evidence.** This
      # step is where five earlier runs hung. A job-level ceiling cannot diagnose that,
      # because the runner kills the whole job and the log's last line is
      # `The action has timed out` - naming no step. Per-step ceilings made it fail in
      # 11 minutes and print the finding underneath: **all 6 specs passing in 2.6
      # seconds and then no summary line at all**, with the next step reporting that
      # port 4173 was still held. The tests had never been the problem.
      - name: Test (browser)
        timeout-minutes: 10
        run: pnpm test:browser
