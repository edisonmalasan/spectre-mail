<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SpectreMail in-page fixture</title>
    <!--
      The page's own cascade, hostile on purpose.

      LINKED, and that is the part that matters. The probe version of this fixture served a
      hostile stylesheet and never referenced it, so "the page's styles do not reach the
      affordance" was true for the wrong reason: the page simply was not hostile. A control
      that does not fire is not a control, and the spec asserts this one fires by reading the
      PAGE'S OWN button.

      Served at runtime by the spec rather than bundled, so it stays an absolute path.
    -->
    <link rel="stylesheet" href="/hostile.css" />
  </head>
  <body>
    <div id="root"></div>
    <!--
      A SAME-ORIGIN IFRAME with an email field of its own, and it is here because of what it
      proves rather than what it exercises.

      `all_frames` is deliberately unset in the manifest - design.md D6 - so the content script
      is injected into the TOP frame only. A field inside a same-origin frame is therefore
      reached by nothing, and the spec's case has to establish that as a fact about the shipped
      manifest rather than as an accident: a frame that never loaded would satisfy the same
      assertion for the wrong reason.

      So the frame carries a MARKER the top document does not have, the case waits for that
      marker from INSIDE the frame, plants the affordance hook there to prove the frame's reader
      can see one, and only then reads the absence.

      `/frame.html` is served by the same route handler, so it cannot 404 quietly - the handler
      throws by name on any unscripted pathname.
    -->
    <iframe id="framed" src="/frame.html" title="a same-origin frame"></iframe>
    <!--
      `type="module"`, and the attribute is load-bearing.

      The first version of this file carried `<script src="/fixture.js">` with no type, and
      Vite reported it could not be bundled without one - then left the tag in place beside a
      bundle emitted under another name. The page loaded an empty script and a 404, and the
      symptom read as "the framework observed nothing" rather than "the fixture never ran".

      The suite serves THIS file and the BUILT `dist/fixture.js`, so the script the browser
      runs is bundled from `page.tsx` - the React in it is real React, not a hand-written
      imitation of a controlled input.
    -->
    <script type="module" src="/fixture.js"></script>
  </body>
</html>
